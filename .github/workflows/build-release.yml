name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web,gui,agent]"
      - name: Run tests
        run: python -m pytest
      - name: Capture real launcher screenshot
        run: python scripts/capture_readme_screenshot.py docs/assets/power-design-toolkit-overview.png --language en
      - name: Upload README screenshot candidate
        uses: actions/upload-artifact@v4
        with:
          name: readme-gui-screenshot
          path: docs/assets/power-design-toolkit-overview.png
          if-no-files-found: error

  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect release-version change
        id: release
        shell: bash
        run: |
          set -euo pipefail
          current=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )
          before="${{ github.event.before }}"
          if git cat-file -e "${before}^{commit}" 2>/dev/null; then
            previous=$(git show "${before}:pyproject.toml" | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')
          else
            previous="$current"
          fi
          tag="v${current}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package version: previous=$previous current=$current"
          git fetch --tags
          if [ "$current" = "$previous" ] || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create annotated release tag
        if: steps.release.outputs.create == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" "$GITHUB_SHA" -m "Power Design Toolkit ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"
      - name: Dispatch packaging workflow from release tag
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run build-release.yml --ref "${{ steps.release.outputs.tag }}"

  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: power-design-tool-macos-arm64
            zip-name: PowerDesignTool-macOS-arm64.zip
            executable: dist/PowerDesignTool.app/Contents/MacOS/PowerDesignTool
          - os: windows-latest
            artifact: power-design-tool-windows-x64
            zip-name: PowerDesignTool-Windows-x64.zip
            executable: dist/PowerDesignTool/PowerDesignTool.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release version
        id: metadata
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if os.environ["GITHUB_REF"].startswith("refs/tags/") and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("release tag/version mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"release version contract OK: {version}")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[gui,dev,web,agent]"
      - name: Run tests
        run: python -m pytest
      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name PowerDesignTool \
            --collect-data llc_design --collect-data pfc_design --collect-data power_codegen \
            --add-data "engineering_data:engineering_data" \
            --collect-submodules llc_design --collect-submodules pfc_design --collect-submodules power_codegen \
            --collect-submodules power_control_tools \
            packaging/launcher.py
      - name: Verify frozen application and fresh evidence
        shell: bash
        run: |
          python packaging/verify_bundle.py "${{ matrix.executable }}" \
            --version "${{ steps.metadata.outputs.version }}" \
            --output "bundle-proof-${{ runner.os }}.json"
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/PowerDesignTool.app "${{ matrix.zip-name }}"
      - name: Zip Windows build
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -Path dist/PowerDesignTool -DestinationPath "${{ matrix.zip-name }}" -Force
      - name: Upload verified package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.zip-name }}
            bundle-proof-${{ runner.os }}.json
          if-no-files-found: error

  publish:
    # A failed platform prevents this job; matrix jobs have no release permission.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Download both verified platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: power-design-tool-*
          path: release
          merge-multiple: true
      - name: Verify both archives and write checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, tomllib, zipfile
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "tag/version mismatch"
          taxonomy_sha = hashlib.sha256(Path("engineering_data/brand_taxonomy.json").read_bytes()).hexdigest()
          packages = (
              ("Windows", "win32", "PowerDesignTool-Windows-x64.zip", "PowerDesignTool/PowerDesignTool.exe"),
              ("macOS", "darwin", "PowerDesignTool-macOS-arm64.zip", "PowerDesignTool.app/Contents/MacOS/PowerDesignTool"),
          )
          manifest = []
          for runner, platform, name, executable in packages:
              proof = json.loads(Path(f"release/bundle-proof-{runner}.json").read_text())
              assert proof["success"] is True and proof["frozen"] is True
              assert proof["version"] == version and proof["platform"] == platform
              assert proof["guided_design"] is True
              assert proof["workspaces"] == ["llc", "pfc", "control", "fra"]
              assert proof["brand_taxonomy_sha256"] == taxonomy_sha
              archive = Path("release") / name
              with zipfile.ZipFile(archive) as bundle:
                  assert executable in bundle.namelist(), f"missing executable in {name}"
                  assert bundle.testzip() is None, f"corrupt archive: {name}"
                  entries = [n for n in bundle.namelist() if n.endswith("/engineering_data/brand_taxonomy.json")]
                  assert any(hashlib.sha256(bundle.read(n)).hexdigest() == taxonomy_sha for n in entries), f"missing/wrong taxonomy: {name}"
              manifest.append(f"{hashlib.sha256(archive.read_bytes()).hexdigest()}  {name}")
          Path("release/SHA256SUMS.txt").write_text("\n".join(manifest) + "\n")
          changes = Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = changes.split("\n## ")
          selected = ["## " + s for s in sections[1:] if s.startswith(version + " ") or (version == "9.4.1" and s.startswith("9.4.0 "))]
          notes = f"# Power Design Toolkit v{version}\n\nBoth Windows x64 and macOS arm64 frozen executables completed verified self-tests. Checksums and machine-readable evidence are attached. Software/model verification is not hardware validation.\n\n" + "\n".join(selected)
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Stage and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft > existing-release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "refusing to overwrite a published release"'
          else
            gh release create "$tag" --verify-tag --draft --title "Power Design Toolkit $tag — Smart Control" --notes-file release-notes.md
          fi
          gh release upload "$tag" release/* --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > uploaded-assets.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          assets = {a["name"]: a for a in json.load(open("uploaded-assets.json"))["assets"]}
          expected = {p.name: p.stat().st_size for p in Path("release").iterdir() if p.is_file()}
          assert set(assets) == set(expected), "incomplete or unexpected release assets"
          for name, size in expected.items():
              assert assets[name]["size"] == size, f"asset size mismatch: {name}"
              digest = hashlib.sha256((Path("release") / name).read_bytes()).hexdigest()
              assert assets[name]["digest"] == f"sha256:{digest}", f"uploaded digest mismatch: {name}"
          PY
          gh release edit "$tag" --notes-file release-notes.md --draft=false --latest
      - name: Mark incomplete 9.4.0 as superseded
        if: github.ref == 'refs/tags/v9.4.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v9.4.0 --json body > old-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          body = json.load(open("old-release.json"))["body"]
          notice = "WARNING: This release is incomplete and superseded by v9.4.1. Its macOS package failed startup because shared engineering data was not bundled. Do not use this release; download v9.4.1 instead.\n\n"
          if not body.startswith("WARNING: This release is incomplete"):
              body = notice + body
          Path("old-release-notes.md").write_text(body, encoding="utf-8")
          PY
          gh release edit v9.4.0 --prerelease --latest=false --notes-file old-release-notes.md
